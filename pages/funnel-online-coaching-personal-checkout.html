<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --gold: #e0bf44; --black: #0a0a0a; --dark: #0d0d0d; --white: #ffffff; --border: #222; }
  body, .d139-checkout-header * { font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  /* Page shell: dark all the way to the edges, no sideways scroll (100vw counts the scrollbar). */
  html, body, #__nuxt, #preview-container, .hl_page-preview--content { background: var(--dark) !important; }
  html, body { overflow-x: hidden; }
  .d139-checkout-header { background: var(--dark); color: var(--white); width: 100%; overflow-x: hidden; }
  .d139-checkout-header .d139-eyebrow { color: var(--gold) !important; }
  /* GHL order form: keep the address search icon from sitting on the placeholder. */
  #__nuxt .hl-address-autocomplete-input-wrapper input[type="text"] { padding-left: 48px !important; }
  .hl-oc-address-autocomplete-search svg path { stroke: rgba(255,255,255,0.45) !important; }
  .d139-banner { background: var(--gold); color: var(--black); text-align: center; padding: 12px 20px; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .d139-header { background: #0a0a0a; border-bottom: 1px solid #1a1a1a; padding: 24px 40px; text-align: center; }
  .d139-header a { display: inline-block; line-height: 0; }
  .d139-header img { height: 80px; width: auto; }
  .d139-progress { background: #111; border-bottom: 1px solid var(--border); padding: 20px 40px; display: flex; align-items: center; justify-content: center; }
  .d139-step { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
  .d139-step.active { color: var(--gold); }
  .d139-step.done   { color: rgba(255,255,255,0.55); }
  .d139-step-num { width: 32px; height: 32px; border-radius: 50%; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 800; flex-shrink: 0; }
  .d139-step.active .d139-step-num { background: var(--gold); border-color: var(--gold); color: var(--black); }
  .d139-step.done .d139-step-num { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.35); }
  .d139-step-connector { width: 56px; height: 1px; background: var(--border); margin: 0 14px; }
  .d139-checkout-title { text-align: center; padding: 52px 24px 36px; background: var(--dark); }
  .d139-eyebrow { font-size: 0.82rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 14px; }
  .d139-checkout-title h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1.05; margin-bottom: 16px; color: var(--white); }
  .d139-checkout-title h1 .gold { color: var(--gold); }
  .d139-checkout-title p { font-size: 1rem; color: rgba(255,255,255,0.58); line-height: 1.7; max-width: 460px; margin: 0 auto 24px; }
  .d139-mem-chip { display: inline-flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 14px; background: #141414; border: 1px solid var(--border); border-radius: 100px; padding: 12px 24px; font-size: 0.92rem; font-weight: 700; }
  .d139-mem-chip .chip-price { color: var(--gold); }
  .d139-mem-chip .chip-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.25); }
  @media (max-width: 600px) { .d139-header img { height: 64px; } .d139-header { padding: 18px 24px; } .d139-step-connector { width: 28px; margin: 0 8px; } .d139-step { font-size: 0.78rem; gap: 8px; } .d139-checkout-title { padding: 40px 20px 28px; } .d139-mem-chip { border-radius: 20px; } }
</style>

<div class="d139-checkout-header">
  <div class="d139-banner">DEFINE139@GMAIL.COM &nbsp;&nbsp;/&nbsp;&nbsp; (304) 320 – 7869</div>
  <div class="d139-header">
    <a href="https://www.define139.com">
      <img src="https://cdn.prod.website-files.com/68f6a737852999ffa54cea22/6a0d226a5f5912db92fddc88_Final%20Logo.png" alt="Define139">
    </a>
  </div>
  <div class="d139-progress">
    <div class="d139-step done"><div class="d139-step-num">✓</div><span>Agreement</span></div>
    <div class="d139-step-connector"></div>
    <div class="d139-step active"><div class="d139-step-num">2</div><span>Payment</span></div>
    <div class="d139-step-connector"></div>
    <div class="d139-step"><div class="d139-step-num">3</div><span>Confirm</span></div>
  </div>
  <div class="d139-checkout-title">
    <p class="d139-eyebrow">Final Step</p>
    <h1>Complete Your <span class="gold">Payment</span></h1>
    <p>You’re officially one step away from starting your journey with Define139. Enter your payment details below to start your coaching.</p>
    <div class="d139-mem-chip">
      <span>Online Personal Coaching</span>
      <span class="chip-dot"></span>
      <span class="chip-price">$79/week</span>
      <span class="chip-dot"></span>
      <span style="color:rgba(255,255,255,0.45);">3-Month Commitment</span>
    </div>
  </div>
</div>
